name: Maven PR Build

# We require all commits go through PR on GitHub
on:
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Maven PR Builder (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        java: [ 17 ]

    steps:
      - name: Check out code
        uses: actions/checkout@5a4ac9002d0be2fb38bd78e4b4dbde5606d7042f # v2
        with:
          lfs: true

      - name: Checkout LFS objects
        run: git lfs checkout

      - name: Install JDK ${{ matrix.java }}
        uses: actions/setup-java@8764a52df183aa0ccea74521dfd9d506ffc7a19a # v2
        with:
          distribution: 'adopt'
          java-version: ${{ matrix.java }}

      - name: Build with Maven
        run: |
          mvn -V -B -ntp validate

      - name: Build with Maven
        run: |
          mvn -V -B -ntp verify -Ddocker.showLogs=true -Ddocker.username=${{ secrets.DOCKER_USERNAME }} \
            -Ddocker.password=${{ secrets.DOCKER_PASSWORD }}
